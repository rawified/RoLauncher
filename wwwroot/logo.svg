<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="RoLauncher">
  <!-- RoLauncher mark: a "play" triangle lifting off (launch) with speed lines and a sparkle. Original artwork. -->
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="rl-glow" cx="0.25" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#rl-bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#rl-glow)"/>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="96.1" y1="136.0" x2="45.9" y2="149.5" stroke-width="15" stroke-opacity="0.92"/>
    <line x1="88.8" y1="109.0" x2="54.0" y2="118.3" stroke-width="13" stroke-opacity="0.6"/>
    <line x1="103.4" y1="163.0" x2="68.6" y2="172.3" stroke-width="13" stroke-opacity="0.6"/>
  </g>
  <!-- play triangle pointing right, turned 15° upward around (156,120); rounded via a same-colour stroke -->
  <polygon points="110,76 110,164 202,120" transform="rotate(-15 156 120)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
  <path d="M206 44 L211 57 L224 62 L211 67 L206 80 L201 67 L188 62 L201 57 Z" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="228" cy="94" r="5" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
